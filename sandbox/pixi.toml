[workspace]
authors = ["Koryna <onlyfordevelopingandsharing@outlook.com>"]
channels = ["conda-forge", "bioconda"]
name = "sandbox"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.12.*"
pysam = ">=0.24.0,<0.25"
jupyterlab = ">=4.6.3,<5"
ipykernel = ">=7.3.0,<8"
pandas = ">=3.0.5,<4"
matplotlib = ">=3.11.1,<4"

# --- viz_scripts (nexons_viz + Streamlit app) ---------------------------
# plotly is pinned to 6.x deliberately. plotly 7 delegates static image
# export to kaleido >=1, which downloads and drives a headless Chrome at
# first use; on a machine without that download the PNG export fails while
# the HTML still works. plotly 6 with kaleido 0.2.1 ships its own renderer
# and exports PNGs offline. Drop both pins once a browser-free export path
# is available.
plotly = ">=6,<7"
kaleido = "0.2.1.*"
streamlit = ">=1.40"
